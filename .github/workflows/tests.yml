name: tests

on:
  push:
  pull_request:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the README supports, and a current one.
        python-version: ["3.10", "3.13"]
    steps:
      # Actions pinned to full commit SHAs (tags can be moved); the tag is noted for humans.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv venv --python ${{ matrix.python-version }}
      # CPU-only torch: the default Linux wheel pulls about 2 GB of CUDA libraries the tests never use.
      - run: uv pip install --index-strategy unsafe-best-match --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      # The embedding model (about 90 MB) is downloaded once, then reused by later runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      # All 37 tests, including the real-model chunking tests and the real-stdio end-to-end tests.
      - run: .venv/bin/python -m pytest -q
